<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153d32">
  <title>SocCom Finance Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-required">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <button id="sidebar-close" class="sidebar-close" type="button" aria-label="Close navigation">×</button>
      <button id="sidebar-collapse" class="sidebar-collapse" type="button" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse or expand sidebar">=</button>
      <a class="brand" href="#" data-page="dashboard" aria-label="Go to dashboard">
        <span class="brand-mark"><img class="brand-mark-logo" src="assets/soccom-logo.png" alt="SocCom logo"></span>
        <span><strong>SocCom</strong><small>FINANCE PORTAL</small></span>
      </a>
      <div class="church-name">PARISH AND ARCHDIOCESAN SHRINE<br>OF SAN ISIDRO LABRADOR<br><span>Cuenca, Batangas</span></div>
      <nav id="navigation" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom">
        <div class="connection-status"><span class="status-dot"></span><span id="connection-label">Supabase required</span></div>
        <button type="button" class="nav-link" data-page="settings"><span class="nav-icon" aria-hidden="true">⚙</span><span>Settings</span></button>
        <div class="user-chip"><span class="avatar" id="user-avatar">N</span><span><strong id="user-name">Not signed in</strong><small id="user-role">Pending</small></span></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button id="menu-toggle" class="icon-button mobile-menu" aria-label="Open navigation">☰</button>
        <div><p class="eyebrow">COMMITTEE ON SOCIAL COMMUNICATIONS</p><h1 id="page-title">Dashboard</h1></div>
        <div class="topbar-actions"><span class="date-pill" id="today-label"></span><button class="button button-primary" id="quick-add">＋ New transaction</button></div>
      </header>
      <section id="page-content" class="page-content" aria-live="polite"></section>
    </main>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <dialog id="transaction-dialog" class="modal"></dialog>
  <dialog id="document-dialog" class="modal document-modal"></dialog>
  <dialog id="auth-dialog" class="modal login-modal" aria-label="Portal sign in"></dialog>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
